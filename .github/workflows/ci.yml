name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    name: Controller tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_car_ui.mjs

  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      # True once the signing secrets from the README are configured.
      HAS_RELEASE_KEY: ${{ secrets.WYZE_CAR_KEYSTORE_BASE64 != '' }}
      SIGN_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wyze-car-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The signing key is only used for pushes to main and version tags,
      # never for pull requests, and only inside this one step.
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true' && env.SIGN_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.WYZE_CAR_KEYSTORE_BASE64 }}
          WYZE_CAR_KEYSTORE: ${{ runner.temp }}/wyze-car-release.p12
          WYZE_CAR_KEYSTORE_PASSWORD: ${{ secrets.WYZE_CAR_KEYSTORE_PASSWORD }}
          WYZE_CAR_KEY_ALIAS: ${{ secrets.WYZE_CAR_KEY_ALIAS }}
          WYZE_CAR_KEY_PASSWORD: ${{ secrets.WYZE_CAR_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f "$WYZE_CAR_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$WYZE_CAR_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true' && env.SIGN_RELEASE == 'true'
        with:
          name: wyze-car-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
