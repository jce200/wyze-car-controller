name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    name: Controller tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_car_ui.mjs

  android:
    name: Android app
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outcome == 'success' }}
    env:
      # True once the signing secrets from the README are configured.
      HAS_RELEASE_KEY: ${{ secrets.WYZE_CAR_KEYSTORE_BASE64 != '' }}
      SIGN_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wyze-car-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The signing key is only used for pushes to main and version tags,
      # never for pull requests, and only inside this one step.
      - name: Build signed release APK
        id: sign
        if: env.HAS_RELEASE_KEY == 'true' && env.SIGN_RELEASE == 'true'
        env:
          # Tags set the version name; the run number keeps builds upgradable.
          WYZE_CAR_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          WYZE_CAR_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.WYZE_CAR_KEYSTORE_BASE64 }}
          WYZE_CAR_KEYSTORE: ${{ runner.temp }}/wyze-car-release.p12
          WYZE_CAR_KEYSTORE_PASSWORD: ${{ secrets.WYZE_CAR_KEYSTORE_PASSWORD }}
          WYZE_CAR_KEY_ALIAS: ${{ secrets.WYZE_CAR_KEY_ALIAS }}
          WYZE_CAR_KEY_PASSWORD: ${{ secrets.WYZE_CAR_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f "$WYZE_CAR_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$WYZE_CAR_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true' && env.SIGN_RELEASE == 'true'
        with:
          name: wyze-car-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish release
    # Version tags only, after the tests passed and the APK was signed.
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: [controller, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wyze-car-android-release
          path: apk
      - name: Build the camera installation packages
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/build-release.py --version "$TAG" --ref HEAD --output dist
      - name: Attach the packages and the APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="dist/wyze-car-controller-android-$TAG.apk"
          mv apk/app-release.apk "$apk"
          # One checksum file for everything attached to the release.
          (cd dist && sha256sum "$(basename "$apk")" >> SHA256SUMS && cat SHA256SUMS)
          # Keep a release that already exists for this tag, such as one
          # holding the camera installer packages.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
